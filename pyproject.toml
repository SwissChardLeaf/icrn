[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "icrn"
version = "0.1.0"
authors = [
  { name="Inhoo Lee", email="research22426@gmail.com" },
]
description = "Indexed Chemical Reaction Networks in a differentiable, tensor-based framework"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/SwissChardLeaf/icrn"
Issues = "https://github.com/SwissChardLeaf/icrn/issues"

[tool.ruff]
line-length = 80

[tool.coverage.run]
source = ["icrn"]
omit = [
    "icrn/test_*.py",
    "icrn/**/test_*.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]