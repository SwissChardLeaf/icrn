name: "Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: coverage run -m unittest discover -s icrn -t . -v

      - name: Execute tutorial notebooks
        run: pytest --nbmake docs/tutorials/

      - name: Coverage report
        if: always()
        run: |
          coverage report -m
          coverage xml
          coverage html

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # A non-editable install catches packaging problems (missing modules,
      # bad package discovery, broken metadata) that "pip install -e ." hides.
      - name: Install from source (non-editable)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Import check
        run: python -c "import icrn; print('imported icrn', icrn.__version__)"
